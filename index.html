<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator - Easy Tutorials</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <div class="container">

        <div class="calculator">

            <h1>JavaScript<br><span>Age Calculator</span></h1>

            <div class="input-box">
                <input type="date" id="date">
                <button id="calculate">Calculator</button>
            </div>

            <div class="result" id="result">
                <p>Your age is:</p>

                <div class="age-result">
                    <span id="years">--</span>
                    <small>Years</small>
                </div>

                <div class="age-result">
                    <span id="months">--</span>
                    <small>Months</small>
                </div>

                <div class="age-result">
                    <span id="days">--</span>
                    <small>Days</small>
                </div>
            </div>

        </div>

    </div>

    <script src="JS/script.js"></script>

</body>
</html>
